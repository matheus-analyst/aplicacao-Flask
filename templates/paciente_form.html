{% extends "base.html" %}

{% block titulo %}Cadastrar Paciente - Clínica Odontológica{% endblock %}

{% block conteudo %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4>{% if request.endpoint == 'routes.criar_paciente' %}📝 Cadastrar Novo Paciente{% else %}✏️ Editar Paciente{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome completo *</label>
                        <input type="text" class="form-control" id="nome" name="nome" 
                               value="{{ paciente.nome if paciente else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone *</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" 
                               value="{{ paciente.telefone if paciente else '' }}" required>
                        <div class="form-text">Ex: (11) 99999-9999</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('routes.listar_pacientes') }}" class="btn btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Salvar Paciente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
